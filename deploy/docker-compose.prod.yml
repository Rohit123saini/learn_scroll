# P-I -- PRODUCTION compose (single host). Postgres/Redis are assumed MANAGED or on their own hosts: set
# DATABASE_URL / REDIS_URL / CELERY_* in /srv/learnscroll/.env (see deploy/env.production.example).
# If you want them on this host too, add the `db`/`redis` services from deploy/staging/docker-compose.staging.yml.
#
#   IMAGE_TAG=$(git rev-parse --short HEAD) docker compose -f deploy/docker-compose.prod.yml --env-file /srv/learnscroll/.env up -d
#   docker compose -f deploy/docker-compose.prod.yml run --rm migrate      # run BEFORE `up` on every release
# TLS: terminate in front (Caddy/LB) and send X-Forwarded-Proto: https. LiveKit: deploy/livekit/ (own host, UDP ranges).
name: learnscroll

x-backend: &backend
  image: learnscroll-backend:${IMAGE_TAG:?set IMAGE_TAG to the tag you built}
  build: {context: ..}
  env_file: [/srv/learnscroll/.env]
  restart: always
  read_only: true                       # image is immutable; only the mounts below are writable
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - media:/srv/learnscroll/backend/media
  logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}

services:
  migrate:
    <<: *backend
    restart: "no"
    profiles: ["tools"]                 # only runs via `compose run --rm migrate`
    command: ["python", "manage.py", "migrate", "--noinput"]

  web:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]      # reverse proxy on the host talks to this
    deploy: {resources: {limits: {memory: 1g}}}

  worker:
    <<: *backend
    command: ["celery", "-A", "LearnScroll", "worker", "--loglevel=INFO", "--concurrency=4", "--max-tasks-per-child=500"]
    stop_grace_period: 120s
    deploy: {resources: {limits: {memory: 2g}}}
    healthcheck:
      test: ["CMD-SHELL", "celery -A LearnScroll inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  beat:
    <<: *backend
    command: ["celery", "-A", "LearnScroll", "beat", "--loglevel=INFO", "--schedule=/var/lib/learnscroll/celerybeat-schedule"]
    volumes:
      - media:/srv/learnscroll/backend/media
      - beatdata:/var/lib/learnscroll

volumes:
  media:
  beatdata:
