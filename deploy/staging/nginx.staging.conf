# nginx in front of daphne (HTTP + WebSocket). Plain :80 -- TLS is terminated upstream (see compose header).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Trust an upstream terminator's X-Forwarded-Proto; fall back to the scheme nginx saw.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

upstream web { server web:8000; keepalive 16; }

server {
    listen 80;
    server_name _;

    # resumable upload chunks are <= 16 MB (MAX_CHUNK_SIZE); leave room for multipart overhead
    client_max_body_size 64m;
    client_body_timeout 120s;

    # Never log ?token= / ?ticket= (P-B2 keeps tokens out of URLs; this is the belt to that braces).
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;        # websockets + long uploads
        proxy_send_timeout 300s;
        proxy_request_buffering off;    # stream upload chunks straight to the app
    }
}
